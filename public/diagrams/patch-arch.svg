<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" style="background:#0A0908;font-family:'JetBrains Mono',monospace">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#FFB000"/>
    </marker>
    <marker id="arrow-dim" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#5C5648"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="28" text-anchor="middle" fill="#FFB000" font-size="13" font-weight="bold" letter-spacing="2">PATCH ORCHESTRATION ARCHITECTURE</text>
  <text x="450" y="46" text-anchor="middle" fill="#5C5648" font-size="10">WELLS FARGO · 10,000+ SERVERS · ZERO UNPLANNED DOWNTIME</text>

  <!-- Phase labels -->
  <text x="80" y="75" text-anchor="middle" fill="#5C5648" font-size="9" letter-spacing="1">PHASE 1</text>
  <text x="280" y="75" text-anchor="middle" fill="#5C5648" font-size="9" letter-spacing="1">PHASE 2</text>
  <text x="520" y="75" text-anchor="middle" fill="#5C5648" font-size="9" letter-spacing="1">PHASE 3</text>
  <text x="760" y="75" text-anchor="middle" fill="#5C5648" font-size="9" letter-spacing="1">PHASE 4</text>

  <!-- Phase 1: CVE Scan + Jenkins -->
  <rect x="20" y="85" width="120" height="50" fill="#14110F" stroke="#4A4E55" stroke-width="1"/>
  <text x="80" y="105" text-anchor="middle" fill="#EAE0CC" font-size="8" font-weight="bold">CVE SCAN REPORT</text>
  <text x="80" y="118" text-anchor="middle" fill="#A89F8C" font-size="7">Quarterly compliance</text>
  <text x="80" y="129" text-anchor="middle" fill="#A89F8C" font-size="7">RHEL + Windows fleet</text>

  <line x1="140" y1="110" x2="165" y2="110" stroke="#FFB000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="165" y="85" width="110" height="50" fill="#14110F" stroke="#FFB000" stroke-width="1.5"/>
  <text x="220" y="105" text-anchor="middle" fill="#FFB000" font-size="9" font-weight="bold">JENKINS</text>
  <text x="220" y="118" text-anchor="middle" fill="#A89F8C" font-size="7">Reads scan · builds</text>
  <text x="220" y="129" text-anchor="middle" fill="#A89F8C" font-size="7">Ansible inventory</text>

  <!-- AI Agent -->
  <rect x="140" y="155" width="140" height="45" fill="#14110F" stroke="#6FA8DC" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="210" y="172" text-anchor="middle" fill="#6FA8DC" font-size="8" font-weight="bold">AI TRIAGE AGENT</text>
  <text x="210" y="183" text-anchor="middle" fill="#A89F8C" font-size="7">Auto-classifies CVEs</text>
  <text x="210" y="193" text-anchor="middle" fill="#A89F8C" font-size="7">3,000+ hrs saved/yr</text>
  <line x1="220" y1="135" x2="220" y2="155" stroke="#6FA8DC" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Arrow to Canary -->
  <line x1="275" y1="110" x2="330" y2="110" stroke="#FFB000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Phase 2: Canary (5%) -->
  <rect x="330" y="85" width="180" height="70" fill="#14110F" stroke="#FFB000" stroke-width="2"/>
  <text x="420" y="103" text-anchor="middle" fill="#FFB000" font-size="9" font-weight="bold">CANARY TIER — 5%</text>
  <line x1="340" y1="110" x2="500" y2="110" stroke="#4A4E55" stroke-width="0.5"/>
  <text x="420" y="122" text-anchor="middle" fill="#EAE0CC" font-size="8">~500 servers patched first</text>
  <text x="420" y="133" text-anchor="middle" fill="#A89F8C" font-size="7">Health checks: svc · response · logs</text>
  <text x="420" y="143" text-anchor="middle" fill="#A89F8C" font-size="7">15-min observation window</text>

  <!-- Health check pass/fail -->
  <text x="420" y="168" text-anchor="middle" fill="#93C47D" font-size="8">PASS → proceed</text>
  <text x="420" y="180" text-anchor="middle" fill="#7A1F1F" font-size="8">FAIL → auto-rollback</text>

  <!-- Arrow to Batch -->
  <line x1="510" y1="110" x2="580" y2="110" stroke="#FFB000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Phase 3: Batch -->
  <rect x="580" y="85" width="200" height="70" fill="#14110F" stroke="#FFB000" stroke-width="2"/>
  <text x="680" y="103" text-anchor="middle" fill="#FFB000" font-size="9" font-weight="bold">BATCH TIER — REMAINING 95%</text>
  <line x1="590" y1="110" x2="770" y2="110" stroke="#4A4E55" stroke-width="0.5"/>
  <text x="680" y="122" text-anchor="middle" fill="#EAE0CC" font-size="8">200-host parallel batches</text>
  <text x="680" y="133" text-anchor="middle" fill="#A89F8C" font-size="7">Windows Server 2016/2019 · RHEL 7/8</text>
  <text x="680" y="143" text-anchor="middle" fill="#A89F8C" font-size="7">Ubuntu LTS · mixed environments</text>

  <!-- Rollback on each batch boundary -->
  <text x="680" y="168" text-anchor="middle" fill="#A89F8C" font-size="8">Health checks at every batch boundary</text>
  <text x="680" y="180" text-anchor="middle" fill="#7A1F1F" font-size="8">Auto-rollback if any boundary fails</text>

  <!-- Arrow to compliance -->
  <line x1="780" y1="110" x2="820" y2="110" stroke="#FFB000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Phase 4: Compliance -->
  <rect x="820" y="85" width="60" height="50" fill="#14110F" stroke="#4A4E55" stroke-width="1"/>
  <text x="850" y="103" text-anchor="middle" fill="#EAE0CC" font-size="8">COMPLIANCE</text>
  <text x="850" y="115" text-anchor="middle" fill="#A89F8C" font-size="7">Audit report</text>
  <text x="850" y="126" text-anchor="middle" fill="#A89F8C" font-size="7">CVE evidence</text>

  <!-- US/India teams -->
  <rect x="330" y="220" width="200" height="55" fill="none" stroke="#4A4E55" stroke-width="1"/>
  <text x="430" y="237" text-anchor="middle" fill="#5C5648" font-size="9" letter-spacing="1">KANBAN TEAM</text>
  <text x="430" y="250" text-anchor="middle" fill="#A89F8C" font-size="8">10 engineers · US + India</text>
  <text x="430" y="262" text-anchor="middle" fill="#A89F8C" font-size="8">Daily standup across timezones</text>
  <text x="430" y="273" text-anchor="middle" fill="#FFB000" font-size="8">35% delivery acceleration</text>

  <!-- Ansible playbook detail -->
  <rect x="20" y="300" width="280" height="130" fill="none" stroke="#5C5648" stroke-width="1"/>
  <text x="160" y="318" text-anchor="middle" fill="#A89F8C" font-size="9" letter-spacing="1">ANSIBLE PLAYBOOK STRUCTURE</text>
  <text x="30" y="335" fill="#FFB000" font-size="8">inventory/</text>
  <text x="45" y="348" fill="#A89F8C" font-size="7">├── canary.yml    # 5% of fleet</text>
  <text x="45" y="360" fill="#A89F8C" font-size="7">├── batch.yml     # 200-host groups</text>
  <text x="45" y="372" fill="#A89F8C" font-size="7">└── all.yml       # full fleet</text>
  <text x="30" y="387" fill="#FFB000" font-size="8">playbooks/</text>
  <text x="45" y="400" fill="#A89F8C" font-size="7">├── patch.yml     # main patch logic</text>
  <text x="45" y="412" fill="#A89F8C" font-size="7">├── healthcheck.yml</text>
  <text x="45" y="424" fill="#A89F8C" font-size="7">└── rollback.yml  # auto-triggered</text>

  <!-- Results summary -->
  <rect x="580" y="230" width="300" height="100" fill="none" stroke="#5C5648" stroke-width="1"/>
  <text x="730" y="248" text-anchor="middle" fill="#A89F8C" font-size="9" letter-spacing="1">RESULTS</text>
  <text x="590" y="265" fill="#FFB000" font-size="9">▸ 10,000+ servers · zero unplanned downtime</text>
  <text x="590" y="280" fill="#FFB000" font-size="9">▸ 50% patch cycle time reduction</text>
  <text x="590" y="295" fill="#FFB000" font-size="9">▸ 70% manual error reduction</text>
  <text x="590" y="310" fill="#FFB000" font-size="9">▸ 3,000+ engineering hours saved/yr</text>

  <!-- Footer -->
  <text x="450" y="465" text-anchor="middle" fill="#5C5648" font-size="8">Wells Fargo · Charlotte, NC · Dec 2022 – Feb 2025</text>
</svg>
