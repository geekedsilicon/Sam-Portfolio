<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" style="background:#0A0908;font-family:'JetBrains Mono',monospace">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#FFB000"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" fill="#FFB000" font-size="13" font-weight="bold" letter-spacing="2">NAT WITH P4 — ARCHITECTURE</text>
  <text x="400" y="48" text-anchor="middle" fill="#5C5648" font-size="10">ONR × USC RESEARCH · 2022</text>

  <!-- Control Plane -->
  <rect x="20" y="65" width="180" height="80" fill="none" stroke="#5C5648" stroke-width="1"/>
  <text x="110" y="82" text-anchor="middle" fill="#A89F8C" font-size="9" letter-spacing="1">CONTROL PLANE</text>
  <rect x="35" y="90" width="150" height="40" fill="#14110F" stroke="#4A4E55" stroke-width="1"/>
  <text x="110" y="107" text-anchor="middle" fill="#EAE0CC" font-size="9">P4Runtime / gRPC</text>
  <text x="110" y="120" text-anchor="middle" fill="#5C5648" font-size="8">Rule insertion + table mgmt</text>

  <!-- Arrow: Control → Ingress -->
  <line x1="200" y1="110" x2="240" y2="160" stroke="#5C5648" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- Packet In -->
  <text x="30" y="185" fill="#FFB000" font-size="10">PACKET IN</text>
  <line x1="100" y1="180" x2="240" y2="180" stroke="#FFB000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Ingress Parser -->
  <rect x="245" y="148" width="130" height="60" fill="#14110F" stroke="#FFB000" stroke-width="1.5"/>
  <text x="310" y="170" text-anchor="middle" fill="#FFB000" font-size="9" font-weight="bold" letter-spacing="1">INGRESS PARSER</text>
  <text x="310" y="184" text-anchor="middle" fill="#A89F8C" font-size="8">IP · TCP/UDP</text>
  <text x="310" y="196" text-anchor="middle" fill="#A89F8C" font-size="8">Header extraction</text>

  <!-- Arrow: Ingress → Match-Action -->
  <line x1="375" y1="178" x2="415" y2="178" stroke="#FFB000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Match-Action Tables -->
  <rect x="420" y="130" width="160" height="100" fill="#14110F" stroke="#FFB000" stroke-width="2"/>
  <text x="500" y="150" text-anchor="middle" fill="#FFB000" font-size="9" font-weight="bold" letter-spacing="1">MATCH-ACTION TABLES</text>
  <line x1="430" y1="158" x2="570" y2="158" stroke="#4A4E55" stroke-width="0.5"/>
  <text x="500" y="172" text-anchor="middle" fill="#EAE0CC" font-size="8">NAT translation table</text>
  <text x="500" y="185" text-anchor="middle" fill="#EAE0CC" font-size="8">Port allocation registers</text>
  <text x="500" y="198" text-anchor="middle" fill="#EAE0CC" font-size="8">ICMP special-case rules</text>
  <text x="500" y="211" text-anchor="middle" fill="#5C5648" font-size="7">P4 register arrays — stateful</text>
  <text x="500" y="222" text-anchor="middle" fill="#5C5648" font-size="7">No control plane per packet</text>

  <!-- Arrow: Match-Action → Egress -->
  <line x1="580" y1="178" x2="620" y2="178" stroke="#FFB000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Egress Deparser -->
  <rect x="625" y="148" width="130" height="60" fill="#14110F" stroke="#FFB000" stroke-width="1.5"/>
  <text x="690" y="170" text-anchor="middle" fill="#FFB000" font-size="9" font-weight="bold" letter-spacing="1">EGRESS DEPARSER</text>
  <text x="690" y="184" text-anchor="middle" fill="#A89F8C" font-size="8">Header rewrite</text>
  <text x="690" y="196" text-anchor="middle" fill="#A89F8C" font-size="8">Checksum recalculation</text>

  <!-- Packet Out -->
  <line x1="755" y1="178" x2="790" y2="178" stroke="#FFB000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="760" y="168" fill="#FFB000" font-size="10">OUT</text>

  <!-- Wireshark validation -->
  <rect x="245" y="290" width="465" height="55" fill="none" stroke="#4A4E55" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="477" y="308" text-anchor="middle" fill="#5C5648" font-size="9" letter-spacing="1">WIRESHARK VALIDATION LAYER</text>
  <line x1="310" y1="208" x2="310" y2="290" stroke="#4A4E55" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="500" y1="230" x2="500" y2="290" stroke="#4A4E55" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="690" y1="208" x2="690" y2="290" stroke="#4A4E55" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="310" y="320" text-anchor="middle" fill="#A89F8C" font-size="8">Pre-NAT capture</text>
  <text x="500" y="320" text-anchor="middle" fill="#A89F8C" font-size="8">In-flight inspection</text>
  <text x="690" y="320" text-anchor="middle" fill="#A89F8C" font-size="8">Post-NAT capture</text>
  <text x="477" y="335" text-anchor="middle" fill="#5C5648" font-size="8">BMv2 software switch · Linux VM cluster</text>

  <!-- Results -->
  <rect x="20" y="290" width="200" height="80" fill="none" stroke="#5C5648" stroke-width="1"/>
  <text x="120" y="308" text-anchor="middle" fill="#A89F8C" font-size="9" letter-spacing="1">KEY RESULTS</text>
  <text x="30" y="325" fill="#FFB000" font-size="9">▸ 28% control efficiency ↑</text>
  <text x="30" y="340" fill="#FFB000" font-size="9">▸ 40% config time ↓</text>
  <text x="30" y="355" fill="#FFB000" font-size="9">▸ 100+ vulns identified</text>

  <!-- Footer -->
  <text x="400" y="390" text-anchor="middle" fill="#5C5648" font-size="8">Office of Naval Research × University of South Carolina · Jan–Apr 2022</text>
</svg>
