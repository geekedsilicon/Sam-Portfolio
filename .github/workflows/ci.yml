name: CI

on:
  pull_request:
  push:
    branches: [main, claude/modern-portfolio-display-2Gya2]

jobs:
  typecheck-lint:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: typecheck-lint
    env:
      NEXT_PUBLIC_BUILD_HASH: ${{ github.sha }}
      NEXT_PUBLIC_SITE_URL: https://samuelkelley.dev
      # DB not needed for static build check — skip DB-dependent features
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      RESEND_API_KEY: placeholder
      CONTACT_TO_EMAIL: samuel.c.kelley@proton.me
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next/
          retention-days: 1
